apiVersion: "serving.kserve.io/v1alpha1"
kind: InferenceGraph 
metadata: 
  name: my-graph2
  namespace: kserve-inference
spec: 
  nodes: 
    ### START CONF HERE
    root:
      routerType: Switch
      steps:
      - nodeName: ensembleNode1
        condition: "[@this].#(modelType==\"lgbm\")"
      - nodeName: ensembleNode2
        condition: "[@this].#(modelType==\"xgb\")"
    ensembleNode1:
      routerType: Ensemble
      steps:
      - serviceName: bike-lgbm-1
      - serviceName: bike-lgbm-2
    ensembleNode2:
      routerType: Ensemble
      steps:
      - serviceName: bike-xgb-1
      - serviceName: bike-xgb-2
    ### END CONF HERE